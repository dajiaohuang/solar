name: Publish asteroid dataset

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Dataset resolution
        required: true
        default: full
        type: choice
        options: [full, lite]

permissions:
  contents: read

concurrency:
  group: asteroid-data-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build source snapshot into versioned shards
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$REQUESTED_MODE" = "lite" ]; then npm run data:lite; else npm run data:full; fi
      - run: npm run validate:data
      - name: Validate application against generated dataset
        run: |
          npm run lint
          npm run test:unit
          npm run build:candidate
          npm run check:capacity
          npx playwright install --with-deps chromium
          PLAYWRIGHT_REUSE_BUILD=1 PLAYWRIGHT_EXPECT_DATASET=1 npm run test:e2e
          npm run benchmark:catalog
      - name: Package immutable release
        id: package
        run: |
          VERSION=$(node -p "require('./public/data/asteroids/dataset-version.json').activeVersion")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/package-dataset.mjs public/data/asteroids asteroid-dataset.tar.gz
          ASSET_SHA256=$(sha256sum asteroid-dataset.tar.gz | awk '{print $1}')
          echo "asset_sha256=$ASSET_SHA256" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          LOCAL_ASSET_SHA256: ${{ steps.package.outputs.asset_sha256 }}
        run: |
          if gh release view "dataset-$VERSION" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "dataset-$VERSION" --pattern asteroid-dataset.tar.gz --dir existing-release
            EXISTING_ASSET_SHA256=$(sha256sum existing-release/asteroid-dataset.tar.gz | awk '{print $1}')
            if [ "$EXISTING_ASSET_SHA256" != "$LOCAL_ASSET_SHA256" ]; then
              echo "Existing immutable asset differs from the deterministic local package." >&2
              echo "existing=$EXISTING_ASSET_SHA256 local=$LOCAL_ASSET_SHA256" >&2
              exit 1
            fi
            echo "Immutable dataset release dataset-$VERSION already exists with the expected asset; reusing it."
            echo "asset_sha256=$EXISTING_ASSET_SHA256" >> "$GITHUB_OUTPUT"
          else
            gh release create "dataset-$VERSION" asteroid-dataset.tar.gz \
              --title "Asteroid dataset $VERSION" \
              --notes "Immutable MPCORB-derived dataset. The archive contains provenance, SHA-256 checksums, a validation report, search indexes, and Float64 binary shards."
            echo "asset_sha256=$LOCAL_ASSET_SHA256" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the protected dataset pin branch
        id: pin
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ASSET_SHA256: ${{ steps.release.outputs.asset_sha256 }}
        run: node scripts/dataset-pin-automation.mjs prepare-pin "$VERSION" "$ASSET_SHA256"

      - name: Validate, merge, and deploy the exact protected pin
        if: steps.pin.outputs.changed == 'true'
        id: publish_pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/dataset-pin-automation.mjs orchestrate
          "${{ steps.package.outputs.version }}"
          "${{ steps.pin.outputs.branch }}"
          "${{ steps.pin.outputs.base_sha }}"
          "${{ steps.pin.outputs.head_sha }}"
