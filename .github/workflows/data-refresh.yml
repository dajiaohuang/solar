name: Publish asteroid dataset

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Dataset resolution
        required: true
        default: full
        type: choice
        options: [full, lite]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: asteroid-data-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build source snapshot into versioned shards
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$REQUESTED_MODE" = "lite" ]; then npm run data:lite; else npm run data:full; fi
      - run: npm run validate:data
      - name: Package immutable release
        id: package
        run: |
          VERSION=$(node -p "require('./public/data/asteroids/dataset-version.json').activeVersion")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          tar -czf asteroid-dataset.tar.gz -C public/data/asteroids .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "dataset-$VERSION" >/dev/null 2>&1; then
            echo "Immutable dataset release dataset-$VERSION already exists; reusing it."
          else
            gh release create "dataset-$VERSION" asteroid-dataset.tar.gz \
              --title "Asteroid dataset $VERSION" \
              --notes "Immutable MPCORB-derived dataset. The archive contains provenance, SHA-256 checksums, a validation report, search indexes, and Float64 binary shards."
          fi

      - name: Prepare dataset pin update branch
        id: pin
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          BRANCH="automation/dataset-pin-$VERSION"
          git fetch origin main
          git switch -C "$BRANCH" origin/main
          printf '%s\n' "dataset-$VERSION" > .github/asteroid-dataset-tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asteroid-dataset-tag
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: pin asteroid dataset $VERSION"
          git push --force-with-lease origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pin PR, run CI, and enable auto-merge
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          BRANCH: ${{ steps.pin.outputs.branch }}
        run: |
          PR_URL=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: pin asteroid dataset $VERSION" \
              --body "Automated immutable dataset pin update. Merge is gated by the required verify and e2e checks.")
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
