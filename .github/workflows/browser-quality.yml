name: Browser quality matrix

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit validated by the calling quality workflow
        required: false
        type: string
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: Browser quality / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PRs exercise both Chromium viewports in one installation/build.
        # Weekly/manual runs add the two independent browser engines.
        browser: ${{ fromJSON(inputs.checkout_ref != '' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run accessibility and interaction checks with real graphics
        env:
          CI: 1
          FULL_BROWSER_MATRIX: 1
          PLAYWRIGHT_FIREFOX_HEADED: ${{ matrix.browser == 'firefox' && '1' || '0' }}
          LIBGL_ALWAYS_SOFTWARE: 1
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER_ENGINE" = "chromium" ]; then
            npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium --workers=2
          else
            xvfb-run --auto-servernum npm run test:e2e -- --project="desktop-$BROWSER_ENGINE" --workers=2
          fi
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-quality-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
