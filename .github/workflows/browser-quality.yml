name: Browser quality matrix

on:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality
  cancel-in-progress: true

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Chromium, Firefox, and WebKit accessibility and interaction checks
        env:
          CI: 1
          FULL_BROWSER_MATRIX: 1
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-quality-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
