name: Deploy application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require pinned immutable asteroid dataset
        env:
          DATASET_TAG: ${{ vars.ASTEROID_DATASET_TAG }}
        run: |
          if [ -z "$DATASET_TAG" ]; then
            echo "ASTEROID_DATASET_TAG is not configured. Publish a validated dataset before deploying the application." >&2
            exit 1
          fi

      - name: Fetch pinned immutable asteroid dataset
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_TAG: ${{ vars.ASTEROID_DATASET_TAG }}
        run: |
          mkdir -p public/data/asteroids
          gh release download "$DATASET_TAG" --pattern asteroid-dataset.tar.gz
          tar -xzf asteroid-dataset.tar.gz -C public/data/asteroids
          npm run validate:data

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
