name: Deploy application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve pinned immutable asteroid dataset
        id: dataset
        run: |
          DATASET_TAG=$(tr -d '\r\n' < .github/asteroid-dataset-tag)
          if [[ ! "$DATASET_TAG" =~ ^dataset-mpcorb-[a-f0-9]{16}-(full|lite)$ ]]; then
            echo "Invalid or missing .github/asteroid-dataset-tag. Publish a validated dataset before deploying the application." >&2
            exit 1
          fi
          echo "tag=$DATASET_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned immutable asteroid dataset
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_TAG: ${{ steps.dataset.outputs.tag }}
        run: |
          mkdir -p public/data/asteroids
          gh release download "$DATASET_TAG" --pattern asteroid-dataset.tar.gz
          tar -xzf asteroid-dataset.tar.gz -C public/data/asteroids
          npm run validate:data

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
