name: Deploy application
run-name: ${{ inputs.request_id || format('Deploy {0}', github.sha) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact main commit required by an automated dispatch
        required: false
        type: string
      request_id:
        description: Optional unique identity used to locate an automated run
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the explicitly dispatched main commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
        run: node scripts/dataset-pin-automation.mjs validate-deploy-dispatch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve pinned immutable asteroid dataset
        id: dataset
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pin = JSON.parse(fs.readFileSync('.github/asteroid-dataset.json', 'utf8'))
          if (!/^dataset-mpcorb-[a-f0-9]{16}-(full|lite)$/.test(pin.tag) ||
              pin.version !== pin.tag.slice('dataset-'.length) ||
              pin.asset !== 'asteroid-dataset.tar.gz' ||
              !/^[a-f0-9]{64}$/.test(pin.assetSha256)) {
            throw new Error('Invalid asteroid dataset pin contract')
          }
          const output = process.env.GITHUB_OUTPUT
          fs.appendFileSync(output, `tag=${pin.tag}\nasset=${pin.asset}\nasset_sha256=${pin.assetSha256}\nversion=${pin.version}\n`)
          NODE

      - name: Fetch pinned immutable asteroid dataset
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_TAG: ${{ steps.dataset.outputs.tag }}
          DATASET_ASSET: ${{ steps.dataset.outputs.asset }}
          DATASET_ASSET_SHA256: ${{ steps.dataset.outputs.asset_sha256 }}
        run: |
          mkdir -p public/data/asteroids
          gh release download "$DATASET_TAG" --pattern "$DATASET_ASSET"
          echo "$DATASET_ASSET_SHA256  $DATASET_ASSET" | sha256sum --check --strict
          tar -xzf "$DATASET_ASSET" -C public/data/asteroids
          npm run validate:data
          npm run benchmark:catalog

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:scientific
      - name: Build deployable application and compressed pinned dataset
        run: npm run build:deploy
      - run: npm run check:capacity
      - name: Verify hosted Chrome availability
        run: google-chrome --version
      - name: Run npm run test:e2e
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          PLAYWRIGHT_REUSE_BUILD: 1
          PLAYWRIGHT_EXPECT_DATASET: 1
        run: npm run test:e2e
      - name: Enforce Lighthouse accessibility and performance budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            http://127.0.0.1:4188/solar/?v=3&page=home&lang=en
            http://127.0.0.1:4188/solar/stories/geocentric-model/
          runs: 3
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload build identity and capacity evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence
          path: |
            dist/build-info.json
            dist/health.json
            dist/capacity-report.json
            dist/asset-manifest.json
            dist/scientific-validation.json
          retention-days: 30
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify hosted Chrome availability
        run: google-chrome --version
      - name: Verify production deployment
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_BROWSER: 1
          SMOKE_BROWSER_CHANNEL: chrome
        run: node scripts/smoke-production.mjs
      - name: Open or update deployment incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Production smoke test failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="The production smoke test failed for $GITHUB_SHA. Run: $RUN_URL"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
