name: Mobile applications

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit validated by the calling quality workflow
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'resources/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'tests/**'
      - 'index.html'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation_scope:
    name: Native validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reuse only recent successful checks for this exact main head
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-quality-reuse.mjs

  android:
    needs: validation_scope
    if: needs.validation_scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Set up the patched Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci
      - name: Verify independent native projects
        run: npm run native:check
      - name: Verify shared Go backend and concurrent cancellation
        run: |
          go vet ./cmd/... ./internal/...
          go test -race ./cmd/... ./internal/...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./cmd/... ./internal/...
      - name: Generate Go handler tiles and verify Web numeric parity
        env:
          SOLAR_STATE_TILE_FIXTURE_DIR: ${{ runner.temp }}/solar-state-tile-fixture
        run: |
          go run ./cmd/state-tile-fixture -out "$SOLAR_STATE_TILE_FIXTURE_DIR" -tile-size 1
          npx vitest run tests/unit/state-tiles-golden.test.ts
      - name: Verify Android API contract
        run: |
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "minSdkVersion = 24" android/variables.gradle
      - name: Build debug-key-signed Android application
        working-directory: android
        env:
          SOLAR_STATE_TILE_FIXTURE_DIR: ${{ runner.temp }}/solar-state-tile-fixture
        run: |
          chmod +x gradlew
          ./gradlew lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: solar-atlas-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare isolated Android runtime
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-36;default;x86_64"
          # Grant only this ephemeral runner user access to the existing KVM device.
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Run native Android UI against real SPK over HTTPS
        run: node scripts/android-native-smoke.mjs
      - name: Retain Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solar-atlas-android-native-smoke
          path: build/android-native-smoke/
          if-no-files-found: warn
          retention-days: 14

  ios:
    needs: validation_scope
    if: needs.validation_scope.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up the patched Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj
      - name: Verify independent native projects
        run: npm run native:check
      - name: Generate Go handler tiles and verify Web numeric parity
        env:
          SOLAR_STATE_TILE_FIXTURE_DIR: ${{ runner.temp }}/solar-state-tile-fixture
        run: |
          go run ./cmd/state-tile-fixture -out "$SOLAR_STATE_TILE_FIXTURE_DIR" -tile-size 1
          npx vitest run tests/unit/state-tiles-golden.test.ts
      - name: Validate native state protocol and cache
        env:
          SOLAR_STATE_TILE_FIXTURE_DIR: ${{ runner.temp }}/solar-state-tile-fixture
        run: |
          swiftc ios/App/App/StateTileDecoder.swift ios/App/App/StateTileCache.swift ios/App/App/NativeStateProjection.swift ios/App/App/NativeCoverageReport.swift ios/App/App/NativeSourceIdentityPage.swift ios/ProtocolTests/ProtocolTests.swift -o "$RUNNER_TEMP/solar-ios-protocol-tests"
          "$RUNNER_TEMP/solar-ios-protocol-tests"
      - name: Build unsigned iOS simulator application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath build/ios-derived-data
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run native iOS UI against real SPK over HTTPS
        run: node scripts/ios-native-smoke.mjs
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solar-atlas-ios-native-smoke
          path: build/ios-native-smoke/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: solar-atlas-ios-simulator
          path: build/ios-derived-data/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
