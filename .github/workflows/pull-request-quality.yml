name: Pull request quality
run-name: "${{ inputs.request_id || (github.event_name == 'push' && format('Branch quality: {0}', github.ref_name)) || format('Pull request #{0}', github.event.pull_request.number) }}"

on:
  # Validate an exact staging commit before a protected fast-forward to main.
  # The required status name stays stable; no PR or protection bypass is needed.
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose exact head is being validated
        required: true
        type: string
      base_sha:
        description: Exact main SHA used as the pull request base
        required: true
        type: string
      head_sha:
        description: Exact automation head SHA to validate
        required: true
        type: string
      request_id:
        description: Unique identity used to locate this dispatched run
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-quality-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository_contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_web_quality: ${{ steps.scope.outputs.full_web_quality }}
      native_quality: ${{ steps.scope.outputs.native_quality }}
      backend_quality: ${{ steps.scope.outputs.backend_quality }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the explicit automation base and head identity
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/dataset-pin-automation.mjs validate-quality-dispatch
      - name: Parse repository metadata, verify local links, and check application identity
        run: npm run check:repository
      - name: Classify the pull request
        id: scope
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi
          node scripts/pr-quality-contract.mjs classify "$BASE_SHA" "$HEAD_SHA"

  web_quality:
    name: Web quality
    needs: repository_contract
    if: needs.repository_contract.outputs.full_web_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run test:unit
      - name: Build the production application
        env:
          VITE_SOLAR_API_BASE_URL: /solar-test-api
        run: npm run build
      - run: npm run check:capacity
      - name: Set up Go for backend changes
        if: needs.repository_contract.outputs.backend_quality == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the shared backend
        if: needs.repository_contract.outputs.backend_quality == 'true'
        run: |
          go vet ./cmd/... ./internal/...
          go test -race ./cmd/... ./internal/...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./cmd/... ./internal/...

  mobile_quality:
    name: Mobile quality
    needs: repository_contract
    if: needs.repository_contract.outputs.native_quality == 'true'
    uses: ./.github/workflows/mobile.yml
    with:
      checkout_ref: ${{ inputs.head_sha || github.sha }}
    permissions:
      contents: read
      actions: read

  browser_quality:
    name: Cross-browser quality
    needs: repository_contract
    if: needs.repository_contract.outputs.full_web_quality == 'true'
    uses: ./.github/workflows/browser-quality.yml
    with:
      checkout_ref: ${{ inputs.head_sha || github.sha }}
    permissions:
      contents: read

  pull_request_quality_gate:
    name: Pull request quality gate
    needs: [repository_contract, web_quality, mobile_quality, browser_quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every applicable quality job
        env:
          REPOSITORY_CONTRACT_RESULT: ${{ needs.repository_contract.result }}
          WEB_QUALITY_RESULT: ${{ needs.web_quality.result }}
          MOBILE_QUALITY_RESULT: ${{ needs.mobile_quality.result }}
          BROWSER_QUALITY_RESULT: ${{ needs.browser_quality.result }}
        run: node scripts/pr-quality-contract.mjs gate
