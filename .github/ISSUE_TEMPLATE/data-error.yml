name: Dataset or provenance error
description: Report a catalog record, immutable release, checksum, parser, or provenance problem.
title: "[Data]: "
labels: [data]
body:
  - type: input
    id: version
    attributes:
      label: Dataset version
      placeholder: mpcorb-…-full
    validations:
      required: true
  - type: textarea
    id: record
    attributes:
      label: Object and observed data
      description: Include object ID/designation, field, value, source, and the reproducible URL.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected data and evidence
      description: Link the MPC or JPL primary record and note its epoch and units.
    validations:
      required: true
